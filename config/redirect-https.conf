# ============================================================
# VirtualHost de redirecionamento HTTP (80) -> HTTPS (443)
# Local real: /var/lib/docker/moodle-app/apache2-sites/redirect-https.conf
# Montado em: /etc/apache2/sites-available/redirect-https.conf
# ============================================================

<VirtualHost *:80>
    ServerName learning.test.local
    ServerAlias learning.test.local

    # Redireciona todo o tráfego HTTP para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>
