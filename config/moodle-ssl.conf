# ============================================================
# VirtualHost HTTPS (443) — Moodle
# Local real: /var/lib/docker/moodle-app/apache2-sites/moodle-ssl.conf
# Montado em: /etc/apache2/sites-available/moodle-ssl.conf
# ============================================================

<VirtualHost *:443>
    ServerName learning.test.local
    ServerAlias learning.test.local

    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/star_local_com.pem
    SSLCertificateKeyFile   /etc/apache2/ssl/star_local_com.key

    # Opcional: forçar TLS 1.2 / 1.3
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
